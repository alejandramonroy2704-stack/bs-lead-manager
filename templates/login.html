<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BS Lead Manager — Login</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --orange: #e85d04;
    --orange-dark: #c94e03;
    --black: #111;
    --bg: #f0f2f5;
    --card: #fff;
    --border: #e0e0e0;
    --text: #1a1a1a;
    --muted: #6b7280;
    --red: #dc2626;
    --radius: 10px;
    --shadow: 0 4px 24px rgba(0,0,0,.10);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex;
    align-items: center; justify-content: center;
  }
  .login-box {
    background: var(--card); border-radius: 16px;
    box-shadow: var(--shadow); padding: 40px 36px;
    width: 100%; max-width: 380px;
  }
  .logo {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 28px; justify-content: center;
  }
  .logo-icon {
    width: 44px; height: 44px; background: var(--orange);
    border-radius: 10px; display: flex; align-items: center;
    justify-content: center; font-weight: 900; font-size: 22px; color: #fff;
  }
  .logo h1 { font-size: 20px; font-weight: 800; }
  .logo span { color: var(--orange); }
  .subtitle {
    text-align: center; color: var(--muted); font-size: 13px;
    margin-bottom: 28px; margin-top: -18px;
  }
  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block; font-size: 12px; font-weight: 600;
    color: var(--muted); text-transform: uppercase;
    letter-spacing: .5px; margin-bottom: 6px;
  }
  .form-group input {
    width: 100%; padding: 11px 14px; border: 1.5px solid var(--border);
    border-radius: 8px; font-size: 15px; font-family: inherit;
    transition: border-color .15s; background: #fff;
  }
  .form-group input:focus {
    outline: none; border-color: var(--orange);
  }
  .btn-login {
    width: 100%; background: var(--orange); color: #fff;
    border: none; padding: 13px; border-radius: 8px;
    font-size: 15px; font-weight: 700; cursor: pointer;
    transition: background .15s; margin-top: 6px;
  }
  .btn-login:hover { background: var(--orange-dark); }
  .error-msg {
    background: #fee2e2; color: var(--red); border-radius: 8px;
    padding: 10px 14px; font-size: 13px; font-weight: 600;
    margin-bottom: 16px; text-align: center;
    display: {% if error %}block{% else %}none{% endif %};
  }
  .footer-text {
    text-align: center; font-size: 12px; color: var(--muted);
    margin-top: 20px;
  }
</style>
</head>
<body>
<div class="login-box">
  <div class="logo">
    <div class="logo-icon">B</div>
    <h1><span>BS</span> Lead Manager</h1>
  </div>
  <p class="subtitle">B+S Commercial Kitchens · Australia</p>

  {% if error %}
  <div class="error-msg">❌ {{ error }}</div>
  {% endif %}

  <form method="POST" action="/login">
    <div class="form-group">
      <label>Username</label>
      <input type="text" name="username" placeholder="Your username" autofocus autocomplete="username" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" placeholder="Your password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn-login">🔐 Sign In</button>
  </form>
  <p class="footer-text">Restricted access · Authorised personnel only</p>
</div>
</body>
</html>
