services:
  - type: web
    name: bs-lead-manager
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bs-leads-db
          property: connectionString

databases:
  - name: bs-leads-db
    plan: free
